---
name: Build and Publish
on:
  workflow_dispatch:
  push: null
jobs:
  build_and_push:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add build dependencies
        run: sudo apt-get install -y jq
      - name: Get Version
        run: echo "PROJECT_VERSION=$(jq -r .version package.json)"
          >> "${GITHUB_ENV}"
      - name: Build Image
        run: "
          docker buildx build
          -t \"${{secrets.DOCKER_REGISTRY}}/\
          ${{secrets.DOCKER_REGISTRY_NAMESPACE}}/\
          powonline-frontend:${PROJECT_VERSION}\"
          -t \"${{secrets.DOCKER_REGISTRY}}/\
          ${{secrets.DOCKER_REGISTRY_NAMESPACE}}/\
          powonline-frontend:dev\"
          ."
      - name: Login to Private Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Push Docker Image (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: "docker push \"${{secrets.DOCKER_REGISTRY}}/\
          ${{secrets.DOCKER_REGISTRY_NAMESPACE}}/\
          powonline-frontend:${PROJECT_VERSION}\""
      - name: Push dev-build
        if: github.ref == 'refs/heads/develop'
        run: "docker push \"${{secrets.DOCKER_REGISTRY}}/\
          ${{secrets.DOCKER_REGISTRY_NAMESPACE}}/\
          powonline-frontend:dev\""
